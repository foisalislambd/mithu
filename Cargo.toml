[workspace]
resolver = "3"
members = [
    "crates/text",
    "crates/ui",
    "crates/composite",
    "crates/shell",
    "crates/host",
    "crates/mobile",
    "app/mithu",
    "app/mithu-lite",
]
exclude = ["third_party/servo"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
publish = false
authors = ["foisalislambd"]
repository = "https://github.com/foisalislambd/mithu"
homepage = "https://github.com/foisalislambd/mithu"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
