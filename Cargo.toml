[workspace]
resolver = "3"
members = [
    "crates/text",
    "crates/ui",
    "crates/shell",
    "crates/host",
    "app/mithu",
    "app/mithu-lite",
]
exclude = ["third_party/servo"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
publish = false
authors = ["foisalislambd"]
repository = "https://github.com/foisalislambd/mithu"
homepage = "https://github.com/foisalislambd/mithu"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 8
strip = true
