[workspace]
resolver = "3"
members = [
    "crates/base",
    "crates/url",
    "crates/net",
    "crates/dom",
    "crates/html",
    "crates/js",
    "crates/css",
    "crates/style",
    "crates/image",
    "crates/text",
    "crates/layout",
    "crates/paint",
    "crates/shell",
    "app/mithu",
    "tools/measure",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
authors = ["foisalislambd"]
repository = "https://github.com/foisalislambd/mithu"
homepage = "https://github.com/foisalislambd/mithu"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 8
strip = true
