[package]
name = "mithu-net"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "HTTP/1.1 and HTTPS fetch"

[dependencies]
mithu-url = { path = "../url" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# gzip and deflate. The rust backend stays pure Rust; nothing already in the
# workspace inflates Content-Encoding.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# brotli. Same reason: Accept-Encoding advertises br only because this crate
# can inflate it. No HTTP stack in the workspace speaks brotli.
brotli = "8"

[lints]
workspace = true
