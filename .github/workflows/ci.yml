name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install fonts and WebKitGTK for Mithu Lite
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-noto-core libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
      - uses: Swatinem/rust-cache@v2
      - name: VERSION.md matches Cargo.toml
        run: python3 tools/version.py check
      - name: Test
        run: cargo test --workspace

  windows:
    name: Windows smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build, package, and smoke-test Mithu
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build -p mithu --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/package-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MITHU_NO_DIALOG = "1"
          $env:ANGLE_DEFAULT_PLATFORM = "warp"
          $exe = Join-Path (Get-Location) "target\release\mithu-windows\mithu.exe"
          & $exe --smoke-test about:blank
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
