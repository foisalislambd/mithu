name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install fonts and WebKitGTK for Mithu Lite
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
      - uses: Swatinem/rust-cache@v2
      - name: VERSION.md matches Cargo.toml
        run: python3 tools/version.py check
      - name: Test
        run: cargo test --workspace
