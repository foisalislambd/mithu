name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install fonts and WebKitGTK for Mithu Lite
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-noto-core libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
      - uses: Swatinem/rust-cache@v2
      - name: Sync version from VERSION.md
        run: |
          python3 tools/version.py sync
          python3 tools/version.py test
      - name: Test
        run: cargo test --workspace

  windows:
    name: Windows smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Sync version from VERSION.md
        shell: bash
        run: python3 tools/version.py sync
      - name: Build, package, and smoke-test Mithu
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build -p mithu --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/package-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MITHU_NO_DIALOG = "1"
          $env:ANGLE_DEFAULT_PLATFORM = "warp"
          $exe = Join-Path (Get-Location) "target\release\mithu-windows\mithu.exe"
          $output = & $exe --smoke-test about:blank 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Error $output; exit $LASTEXITCODE }
          if ($output -notmatch "smoke ok") {
            Write-Error "smoke test wrote nothing to the parent console: $output"
            exit 1
          }
      - name: Build Mithu Lite and check the parent console
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build -p mithu-lite --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MITHU_NO_DIALOG = "1"
          $exe = Join-Path (Get-Location) "target\release\mithu-lite.exe"
          $output = & $exe --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Error $output; exit $LASTEXITCODE }
          if ($output -notmatch "mithu-lite \d+\.\d+\.\d+") {
            Write-Error "Lite wrote nothing to the parent console: $output"
            exit 1
          }

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-35 build-tools;35.0.0 platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Build the debug APK
        working-directory: mobile/android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: mithu-android-debug
          path: mobile/android/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error

  ios:
    name: Unsigned iOS build
    # One job, on the Intel pool. macos-latest is arm64, and those runners
    # are often cancelled after 15 minutes with no machine assigned.
    if: github.event_name == 'pull_request'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile the unsigned iOS app
        run: sh tools/ios-unsigned.sh
