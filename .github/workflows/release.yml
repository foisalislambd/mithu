name: Release

# Push to main reads VERSION.md. A GitHub Release is created only when that
# semver is strictly greater than the newest v* tag. Cargo.toml is not part of
# the gate: each build runs tools/version.py sync first. Equal, lower, or an
# existing tag skips with success. workflow_dispatch uses the same gate.
# Builds the Servo browser and Mithu Lite for Linux, macOS, and Windows.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - name: Compare VERSION.md with existing tags
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="$(python3 tools/version.py read)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          tags="$(git ls-remote --tags origin 'refs/tags/v*' | awk '{print $2}')"
          latest="$(printf '%s\n' "$tags" | python3 tools/version.py latest)"
          decision="$(python3 tools/version.py compare "$version" "$latest")"
          if git ls-remote --tags origin "refs/tags/v${version}" | grep -q .; then
            echo "tag v${version} already exists"
            decision=skip
          fi
          if [ "$decision" = release ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Will release v${version} (previous: ${latest:-none})"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Skip: ${version} is not newer than ${latest:-none}"
          fi

  full:
    name: mithu ${{ matrix.artifact }}
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            artifact: mithu-linux-x64
            binary: target/release/mithu
          - os: macos-latest
            artifact: mithu-macos
            binary: target/release/mithu
          - os: windows-latest
            artifact: mithu-windows-x64
            binary: target/release/mithu-windows-x64.zip
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - name: Sync version from VERSION.md
        shell: bash
        run: python3 tools/version.py sync
      - name: Linux libraries for Servo
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config python3 gperf \
            libclang-dev libssl-dev libfontconfig1-dev libfreetype-dev \
            libglib2.0-dev libgtk-3-dev libunwind-dev \
            gstreamer1.0-plugins-good libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Build the Servo browser
        run: cargo build -p mithu --release
      - name: Package Windows runtime and smoke-test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pwsh -NoProfile -File tools/package-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MITHU_NO_DIALOG = "1"
          $env:ANGLE_DEFAULT_PLATFORM = "warp"
          $exe = Join-Path (Get-Location) "target\release\mithu-windows\mithu.exe"
          $output = & $exe --smoke-test about:blank 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Error $output; exit $LASTEXITCODE }
          if ($output -notmatch "smoke ok") {
            Write-Error "smoke test wrote nothing to the parent console: $output"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
      - name: Cancel the rest of the run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}"

  lite:
    name: mithu-lite ${{ matrix.artifact }}
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            artifact: mithu-lite-linux-x64
            binary: target/release/mithu-lite
          - os: macos-latest
            artifact: mithu-lite-macos
            binary: target/release/mithu-lite
          - os: windows-latest
            artifact: mithu-lite-windows-x64
            binary: target/release/mithu-lite.exe
    steps:
      - uses: actions/checkout@v4
        with:
          # Cargo resolves every workspace member. mithu-shell path-depends on
          # the Servo package, so the submodule must be on disk even though
          # this job only compiles mithu-lite.
          submodules: true
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - name: Sync version from VERSION.md
        shell: bash
        run: python3 tools/version.py sync
      - name: Linux WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
      - name: Build Mithu Lite
        run: cargo build -p mithu-lite --release
      - name: Lite prints its version on the parent console
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:MITHU_NO_DIALOG = "1"
          $exe = Join-Path (Get-Location) "target\release\mithu-lite.exe"
          $output = & $exe --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Error $output; exit $LASTEXITCODE }
          if ($output -notmatch "mithu-lite \d+\.\d+\.\d+") {
            Write-Error "Lite wrote nothing to the parent console: $output"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
      - name: Cancel the rest of the run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}"

  publish:
    needs: [gate, full, lite]
    if: needs.gate.outputs.release == 'true' && needs.full.result == 'success' && needs.lite.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: mithu-*
      - name: Tag v${{ needs.gate.outputs.version }} and attach artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -eu
          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q .; then
            echo "v${VERSION} already exists; not publishing again"
            exit 0
          fi
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "release v${VERSION} already exists; not publishing again"
            exit 0
          fi
          mkdir -p release
          cp dist/mithu-linux-x64/mithu release/mithu-linux-x64
          cp dist/mithu-macos/mithu release/mithu-macos
          cp dist/mithu-windows-x64/mithu-windows-x64.zip release/mithu-windows-x64.zip
          cp dist/mithu-lite-linux-x64/mithu-lite release/mithu-lite-linux-x64
          cp dist/mithu-lite-macos/mithu-lite release/mithu-lite-macos
          cp dist/mithu-lite-windows-x64/mithu-lite.exe release/mithu-lite-windows-x64.exe
          chmod +x release/mithu-linux-x64 release/mithu-macos release/mithu-lite-linux-x64 release/mithu-lite-macos
          (cd release && sha256sum -- * > SHA256SUMS)
          prerelease=()
          case "$VERSION" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "Mithu ${VERSION}" \
            --generate-notes \
            "${prerelease[@]}" \
            release/*
